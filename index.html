<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="章谦 - AI for Science、蛋白质结构预测与生成式模型" />
    <title>章谦 | Personal Links</title>
    <style>
      :root { --ink:#16231f; --muted:#60706a; --paper:#f7f5ef; --card:#fffefa; --accent:#146b54; --line:#dce4dc; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif; background: radial-gradient(circle at 16% 8%, #dcefe5 0, transparent 30rem), radial-gradient(circle at 88% 92%, #f2e6c9 0, transparent 25rem), var(--paper); }
      main { width:min(100% - 40px, 720px); margin:0 auto; padding:82px 0 56px; }
      .eyebrow { color:var(--accent); font:600 .72rem/1.2 system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase; }
      h1 { font-size:clamp(3.5rem, 12vw, 6.4rem); letter-spacing:-.08em; margin:12px 0 8px; font-weight:600; line-height:.95; }
      .roman { color:var(--muted); letter-spacing:.08em; font:500 .85rem/1.5 system-ui,sans-serif; }
      .intro { max-width:600px; margin:44px 0 34px; font-size:1.12rem; line-height:1.9; }
      .pill-row { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 38px; }
      .pill { border:1px solid var(--line); border-radius:999px; padding:7px 11px; color:var(--muted); background:#ffffff8c; font:500 .78rem/1 system-ui,sans-serif; }
      .links { display:grid; gap:12px; }
      .link { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:20px 22px; border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; background:var(--card); transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
      .link:hover { transform:translateY(-3px); border-color:#8cb8a8; box-shadow:0 12px 26px #1a39291c; }
      .label { display:block; color:var(--muted); margin-bottom:4px; font:600 .7rem/1 system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
      .value { font-size:1.08rem; overflow-wrap:anywhere; }
      .arrow { color:var(--accent); font:1.4rem/1 system-ui,sans-serif; }
      footer { border-top:1px solid var(--line); margin-top:54px; padding-top:18px; color:var(--muted); font: .76rem/1.7 system-ui,sans-serif; }
      @media (max-width:480px) { main { width:min(100% - 28px,720px); padding-top:54px; } .link { padding:17px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Personal Links</div>
      <h1>章谦</h1>
      <div class="roman">QIAN ZHANG</div>
      <p class="intro">复旦大学上海数学与交叉学科研究院博士生。关注 AI for Science、蛋白质结构预测与生成式模型。</p>
      <div class="pill-row" aria-label="研究关键词">
        <span class="pill">AI for Science</span><span class="pill">Protein Structure</span><span class="pill">Generative Models</span>
      </div>
      <section class="links" aria-label="联系方式">
        <a class="link" href="mailto:25114020028@m.fudan.edu.cn">
          <span><span class="label">Email</span><span class="value">25114020028@m.fudan.edu.cn</span></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </section>
      <footer>© 2026 Qian Zhang · Shanghai, China</footer>
    </main>
  </body>
</html>
